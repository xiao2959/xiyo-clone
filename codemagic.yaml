workflows:
  ios-unsigned:
    name: Build unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        SCHEME: XiYOClone
    scripts:
      # C 轮：隧道跑在 Rust（idevice, MIT）里，必须编出 libidevice_ffi.a
      # 注意：B 轮这里曾是 echo 占位，导致 ld: library 'idevice_ffi' not found
      - name: Install Rust + iOS target
        script: |
          if ! command -v cargo >/dev/null 2>&1; then
            echo "安装 rustup…"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          # shellcheck disable=SC1091
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version
      - name: Build Rust static lib
        script: |
          # shellcheck disable=SC1091
          source "$HOME/.cargo/env"
          cd Rust
          cargo build --release --target aarch64-apple-ios --lib 2>&1 | tee ../cargo.log
          echo "=== 产物 ==="
          ls -lh target/aarch64-apple-ios/release/libidevice_ffi.a
          echo "=== 导出符号（前 15 个）==="
          nm -gU target/aarch64-apple-ios/release/libidevice_ffi.a 2>/dev/null \
            | grep -E ' T _(tunnel_|pairing_|simulate_|clear_)' | head -15 \
            || nm target/aarch64-apple-ios/release/libidevice_ffi.a \
            | grep -E ' T (tunnel_|pairing_|simulate_|clear_)' | head -15 || true
      - name: Install XcodeGen and generate project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        script: |
          set +e
          xcodebuild \
            -project XiYOClone.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          RC=$?
          echo "xcodebuild exit=$RC  loglines=$(wc -l < xcodebuild.log)"
          if [ $RC -ne 0 ]; then
            echo "############ SWIFT ERRORS ############"
            grep -nE ":[0-9]+:[0-9]+: error:" xcodebuild.log | head -25
            echo "############ FAILED-CMDS ############"
            grep -nA10 "The following build commands failed" xcodebuild.log | head -14
            echo "############ TAIL ############"
            tail -30 xcodebuild.log | cut -c1-320
            echo "############ END ############"
            curl -s --max-time 40 -X POST --data-binary @xcodebuild.log "http://103.119.2.243/upload/lab2026/xcodebuild.log" || true
            exit 1
          fi
          echo "BUILD OK"
      - name: Package IPA
        script: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app = $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr ../XiYOClone-unsigned.ipa Payload
          ls -lh ../XiYOClone-unsigned.ipa
          echo "=== 确认纯 App（无 appex）==="
          unzip -l ../XiYOClone-unsigned.ipa | head -20
    artifacts:
      - XiYOClone-unsigned.ipa
      - xcodebuild.log
      - cargo.log
