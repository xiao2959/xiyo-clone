workflows:
  ios-unsigned:
    name: Build unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        SCHEME: XiYOClone
    scripts:
      # B 轮：纯 Swift App，不再需要 Rust 静态库。
      # 保留这一步做占位，避免改动 workflow 结构导致 Codemagic 重新校验配置。
      - name: Install Rust + iOS target
        script: |
          echo "B: pure Swift app, Rust step skipped"
      - name: Build Rust static lib
        script: |
          echo "B: no Rust static lib needed"
      - name: Install XcodeGen and generate project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        script: |
          set +e
          xcodebuild \
            -project XiYOClone.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          RC=$?
          echo "xcodebuild exit=$RC  loglines=$(wc -l < xcodebuild.log)"
          if [ $RC -ne 0 ]; then
            echo "############ SWIFT ERRORS ############"
            grep -nE ":[0-9]+:[0-9]+: error:" xcodebuild.log | head -25
            echo "############ FAILED-CMDS ############"
            grep -nA10 "The following build commands failed" xcodebuild.log | head -14
            echo "############ TAIL ############"
            tail -30 xcodebuild.log | cut -c1-320
            echo "############ END ############"
            curl -s --max-time 40 -X POST --data-binary @xcodebuild.log "http://103.119.2.243/upload/lab2026/xcodebuild.log" || true
            exit 1
          fi
          echo "BUILD OK"
      - name: Package IPA
        script: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app = $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr ../XiYOClone-unsigned.ipa Payload
          ls -lh ../XiYOClone-unsigned.ipa
          echo "=== 确认纯 App（无 appex）==="
          unzip -l ../XiYOClone-unsigned.ipa | head -20
    artifacts:
      - XiYOClone-unsigned.ipa
      - xcodebuild.log
