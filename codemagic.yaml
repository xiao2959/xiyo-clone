workflows:
  ios-unsigned:
    name: Build unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        SCHEME: XiYOClone
    scripts:
      # B 轮：纯 Swift App，不再需要 Rust / NetworkExtension
      - name: Install XcodeGen and generate project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        script: |
          set +e
          xcodebuild \
            -project XiYOClone.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          RC=$?
          echo "xcodebuild exit=$RC  loglines=$(wc -l < xcodebuild.log)"
          if [ $RC -ne 0 ]; then
            echo "############ SWIFT ERRORS ############"
            grep -nE ":[0-9]+:[0-9]+: error:" xcodebuild.log | head -25
            echo "############ FAILED-CMDS ############"
            grep -nA10 "The following build commands failed" xcodebuild.log | head -14
            echo "############ TAIL ############"
            tail -30 xcodebuild.log | cut -c1-320
            echo "############ END ############"
            curl -s --max-time 40 -X POST --data-binary @xcodebuild.log "http://103.119.2.243/upload/lab2026/xcodebuild.log" || true
            exit 1
          fi
          echo "BUILD OK"
      - name: Package IPA
        script: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app = $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr ../XiYOClone-unsigned.ipa Payload
          ls -lh ../XiYOClone-unsigned.ipa
      - name: Verify IPA structure
        script: |
          echo "=== IPA 内容 ==="
          unzip -l XiYOClone-unsigned.ipa
          echo "=== 确认没有扩展 / 没有 VPN 依赖 ==="
          if unzip -l XiYOClone-unsigned.ipa | grep -qi '\.appex'; then
            echo "ERROR: 不应该有 appex"; exit 1
          fi
          echo "OK: 纯 App，无扩展"
    artifacts:
      - XiYOClone-unsigned.ipa
      - xcodebuild.log
