workflows:
  ios-unsigned:
    name: Build unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        SCHEME: XiYOClone
    scripts:
      - name: Install Rust + iOS target
        script: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
      - name: Build Rust static lib
        script: |
          source "$HOME/.cargo/env"
          cd Rust
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../App/Bridge/lib
          cp target/aarch64-apple-ios/release/libidevice_ffi.a ../App/Bridge/lib/
          ls -lh ../App/Bridge/lib/
          nm -gU ../App/Bridge/lib/libidevice_ffi.a | awk '{print $NF}' | grep -E '^_(pairing_|simulate_location|clear_location)' | sort
      - name: Install XcodeGen and generate project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        script: |
          set +e
          xcodebuild \
            -project XiYOClone.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          RC=$?
          echo "xcodebuild exit=$RC  loglines=$(wc -l < xcodebuild.log)"
          if [ $RC -ne 0 ]; then
            echo "############ CRASH-CHECK ############"
            grep -nE "PLEASE submit|Stack dump|Segmentation|Killed|signal|Assertion|out of memory" xcodebuild.log | head -6
            echo "############ FAILED-CMDS ############"
            grep -nA10 "The following build commands failed" xcodebuild.log | head -14
            echo "############ FIRST-FAILURE-CONTEXT ############"
            L=$(grep -n "failed" xcodebuild.log | head -1 | cut -d: -f1)
            if [ -n "$L" ]; then
              S=$((L-22)); if [ $S -lt 1 ]; then S=1; fi
              sed -n "${S},$((L+3))p" xcodebuild.log | cut -c1-320
            else
              tail -20 xcodebuild.log | cut -c1-320
            fi
            echo "############ END ############"
            curl -s --max-time 40 -X POST --data-binary @xcodebuild.log "http://103.119.2.243/upload/lab2026/xcodebuild.log" || true
            exit 1
          fi
          echo "BUILD OK"
      - name: Package IPA
        script: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app = $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr ../XiYOClone-unsigned.ipa Payload
          ls -lh ../XiYOClone-unsigned.ipa
    artifacts:
      - XiYOClone-unsigned.ipa
      - xcodebuild.log
