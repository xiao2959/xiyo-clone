name: build-ios

# 备用构建通道：Codemagic UI 触发不稳定时用它。
# B 轮：纯 Swift App，无 Rust / 无 NetworkExtension。
# 产物是未签名 IPA，用全能签签一下即可装。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/probe.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Show tree
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== App ==="
          ls -la App

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate 2>&1 | tee xcodegen.log

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project XiYOClone.xcodeproj \
            -scheme XiYOClone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log || true
          # 失败时也要让 job 失败，但先把日志留下
          if grep -qE ": error:|BUILD FAILED" xcodebuild.log; then exit 1; fi

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app = $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr ../XiYOClone-unsigned.ipa Payload
          ls -lh ../XiYOClone-unsigned.ipa
          echo "=== IPA 内容（确认无 appex）==="
          unzip -l ../XiYOClone-unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XiYOClone-unsigned-ipa
          path: XiYOClone-unsigned.ipa
          if-no-files-found: warn

      # 无论成败都上传日志，免得翻网页找错误
      - name: Upload build log
        if: always()
        run: |
          echo "=== 编译错误 ==="
          grep -nE ": error:|Spec validation|BUILD FAILED" xcodebuild.log 2>/dev/null | head -30 || true
          echo "=== xcodegen 输出 ==="
          tail -20 xcodegen.log 2>/dev/null || true
          for f in xcodebuild.log xcodegen.log; do
            [ -f "$f" ] && curl -s --max-time 40 -X POST --data-binary @"$f" \
              "http://103.119.2.243/upload/lab2026/$f" || true
          done
