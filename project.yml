name: XiYOClone
options:
  bundleIdPrefix: com.lab.xiyoclone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# ===========================================================================
# C 轮：一个 App 搞定（内置隧道）
#
#   架构：
#     主 App（SwiftUI 界面 + 地图 + 授权 + 换算）
#       └── TunnelExtension.appex   ← 新建，负责建 utun
#       └── Rust idevice(MIT)       ← 负责 rppairing / CDTunnel / RSD / 注入
#
#   为什么要扩展：
#     iOS 上普通进程无法创建 utun。访问设备的 RSD（USB 侧 IPv6 地址）
#     必须由 NetworkExtension 的 packet-tunnel 建虚拟网卡。
#     LocalDevVPN 做的事就是这个（573KB），我们内置进去就不需要第二个 App。
#
#   ⚠️ 签名前提：扩展需要独立 bundle id（<主App>.tunnel），
#      因此必须用「通配符 / 多 App ID」描述文件，单 App ID 的证书签不了。
# ===========================================================================
targets:
  XiYOClone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
          # 扩展单独成 target，主 App 不重复编译
          - "Tunnel"
          # 旧链路文件（A 轮遗留，等隧道接通后再逐个启用）
          - "Bridge"
          - "TunnelManager.swift"
          - "DiagView.swift"
          - "PairingView.swift"
          - "BackgroundKeeper.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab.xiyoclone
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - sdk: MapKit.framework
      - target: TunnelExtension
        embed: true

  TunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Tunnel
        excludes:
          - "Info.plist"
          - "Tunnel.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab.xiyoclone.tunnel
        INFOPLIST_FILE: App/Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Tunnel/Tunnel.entitlements

schemes:
  XiYOClone:
    build:
      targets:
        XiYOClone: all
        TunnelExtension: all
    run:
      config: Debug
