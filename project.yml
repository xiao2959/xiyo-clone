name: XiYOClone
options:
  bundleIdPrefix: com.lab.xiyoclone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# ===========================================================================
# B 轮优化：纯换算 App
#
#   A 轮确认 rppairing→隧道→RSD 注入链路无法在当前环境验证，
#   因此把整个 NetworkExtension 扩展、Rust 静态库、配对/自检 UI 全部移除。
#
#   现在 App 只做三件能 100% 验证的事：
#     1. 地图点选（MapKit）
#     2. GCJ-02 → WGS-84 换算（CoordTransform，已与 Python 逐位比对）
#     3. 复制坐标 / 生成 GPX 分享 / 打开 StikDebug（stikdebug://）
#
#   好处：不再需要 NE entitlement，全能签随便签就能装；
#         不再有"扩展无响应 / 10.7.0.1 不通 / 注入失败 -1"。
# ===========================================================================
targets:
  XiYOClone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
          # 旧链路文件：不再参与编译（保留在仓库里，便于以后恢复）
          - "Bridge"
          - "TunnelManager.swift"
          - "DiagView.swift"
          - "PairingView.swift"
          - "BackgroundKeeper.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab.xiyoclone
        INFOPLIST_FILE: App/Info.plist
        # 不再用 entitlements：纯 App 不需要任何特殊权限
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - sdk: MapKit.framework

schemes:
  XiYOClone:
    build:
      targets:
        XiYOClone: all
    run:
      config: Debug
