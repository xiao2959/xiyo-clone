name: XiYOClone
options:
  bundleIdPrefix: com.lab.xiyoclone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# ===========================================================================
# C 轮：一个 App 搞定（内置隧道，纯用户态）
#
#   关键结论（C3 已验证）：
#     idevice 的 tunnel_tcp_stack 用 jktcp —— 纯用户态 TCP 栈，
#     CdTunnel → Adapter::new(stream, our_ip, their_ip) → to_async_handle()
#     **不需要 utun，也就不需要 NetworkExtension 扩展。**
#
#   因此：
#     - 没有 .appex → 不需要通配符证书 → 现有单 App ID 星玥证书就能签
#     - 一个 IPA 装完就能用，不依赖 LocalDevVPN / StikDebug
#
#   组成：
#     SwiftUI 界面（地图/换算/授权）
#     + Rust idevice(MIT) 静态库（rppairing → TLS-PSK/CDTunnel → RSD → CoreDevice 注入）
#
#   扩展源码保留在 App/Tunnel/（已从编译中排除），仅供将来需要 utun 时启用。
# ===========================================================================
targets:
  XiYOClone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
          # 用户态隧道不需要扩展
          - "Tunnel"
          # 仍在排除中：NetworkExtension 方案与早期自检 UI
          # （PairingView / BackgroundKeeper 已恢复启用 —— 配对需要它们）
          - "TunnelManager.swift"
          - "DiagView.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab.xiyoclone
        INFOPLIST_FILE: App/Info.plist
        # 不需要任何特殊 entitlement（无扩展、无 VPN 配置）
        CODE_SIGN_ENTITLEMENTS: ""
        # Rust 静态库的 C ABI
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/include/idevice_ffi.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Rust/target/aarch64-apple-ios/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
    dependencies:
      - sdk: MapKit.framework

schemes:
  XiYOClone:
    build:
      targets:
        XiYOClone: all
    run:
      config: Debug
